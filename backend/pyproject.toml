[project]
name = "starship-telemetry-backend"
version = "0.1.0"
description = "Backend for Starship Telemetry Web View - extracts telemetry from SpaceX livestream frames"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0,<1.0.0",
    "uvicorn[standard]>=0.24.0,<1.0.0",
    "opencv-python-headless>=4.8.0,<5.0.0",
    "easyocr>=1.7.0,<2.0.0",
    "torch>=2.1.0,<3.0.0",
    "numpy>=1.26.0,<2.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "websockets>=12.0,<13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "hypothesis>=6.92.0,<7.0.0",
    "httpx>=0.25.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hypothesis]
database_backend = "directory"
